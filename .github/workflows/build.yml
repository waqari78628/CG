name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      - name: Generate Android Project
        run: npx expo prebuild --platform android --no-install

      - name: Fix Kotlin Version & Compatibility
        run: |
          echo "android.kotlinVersion=1.9.25" >> android/gradle.properties
          echo "kotlin.suppressKotlinVersionCompatibilityCheck=true" >> android/gradle.properties

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -Pandroid.kotlinVersion=1.9.25

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InstruXpert-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
